<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrowArabic — 아랍어 학습</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  :root {
    --ink: #1a1a1a; --sub: #666; --line: #ddd; --bg: #faf9f6; --card: #fff;
    --accent: #0b6e4f; --accent-soft: #e6f2ee; --wrong: #c0392b; --right: #0b6e4f;
  }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    min-height: 100vh;
  }
  .arabic {
    direction: rtl; unicode-bidi: isolate;
    font-family: "SF Arabic", "Geeza Pro", "Arial Unicode MS", sans-serif;
    font-weight: 600; line-height: 1.5;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 17px; cursor: pointer; }
  header .crumb { font-size: 14px; color: var(--sub); }
  main { max-width: 780px; margin: 0 auto; padding: 20px 16px 60px; }

  /* dashboard */
  .stats { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat {
    flex: 1; min-width: 140px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px;
  }
  .stat b { font-size: 26px; display: block; }
  .stat span { font-size: 13px; color: var(--sub); }
  .menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .menu button {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px 18px; font-size: 17px; font-weight: 700; text-align: left;
    cursor: pointer; font-family: inherit; color: var(--ink);
  }
  .menu button small { display: block; font-weight: 400; font-size: 13px; color: var(--sub); margin-top: 5px; }
  .menu button:active { background: var(--accent-soft); }
  .menu .wide { grid-column: 1 / -1; }

  /* flashcard */
  .card-stage {
    position: relative; overflow: hidden;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    min-height: 380px; padding: 30px 24px; text-align: center; cursor: pointer;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
  }
  .tbar { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--accent-soft); }
  .tbar-fill { height: 100%; width: 0; background: var(--accent); }
  .card-stage .arabic { font-size: 72px; }
  .card-emoji { font-size: 64px; line-height: 1; }
  .card-photo { height: 170px; width: 170px; object-fit: cover; border-radius: 14px; }
  .list-thumb { float: left; width: 76px; height: 76px; object-fit: cover; border-radius: 10px; margin: 2px 14px 4px 0; }
  .auto-bar { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; color: var(--sub); }
  .auto-bar select { font-family: inherit; font-size: 15px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  .card-stage .ko-big { font-size: 34px; font-weight: 700; }
  .back-line { font-size: 16px; color: var(--sub); }
  .back-line b { color: var(--ink); font-size: 20px; }
  .fem-line { font-size: 15px; color: var(--sub); }
  .fem-line .arabic { display: inline; font-size: 30px; }
  .ex-line .arabic { display: block; font-size: 30px; }
  .note-line { font-size: 14px; color: var(--accent); }
  .controls { display: flex; gap: 10px; margin-top: 14px; justify-content: center; flex-wrap: wrap; }
  .controls button, .choice, .bigbtn {
    font-family: inherit; font-size: 16px; padding: 12px 20px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); cursor: pointer; color: var(--ink);
  }
  .controls .primary, .bigbtn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
  .hint { text-align: center; color: var(--sub); font-size: 13px; margin-top: 10px; }

  /* quiz */
  .quiz-q {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px 20px; text-align: center; margin-bottom: 14px;
  }
  .quiz-q .arabic { font-size: 64px; }
  .quiz-q .ko-big { font-size: 30px; font-weight: 700; }
  .quiz-q .prompt { font-size: 14px; color: var(--sub); margin-bottom: 10px; }
  .choices { display: grid; gap: 10px; }
  .choice { text-align: center; font-size: 18px; padding: 16px; }
  .choice .arabic { font-size: 34px; }
  .choice.right { border-color: var(--right); background: var(--accent-soft); }
  .choice.wrong { border-color: var(--wrong); background: #fdecea; }
  .feedback { text-align: center; margin-top: 14px; font-size: 15px; min-height: 44px; }
  .assembled {
    direction: rtl; min-height: 64px; margin-top: 14px; padding: 10px;
    border: 2px dashed var(--line); border-radius: 12px; font-size: 38px;
  }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; direction: rtl; }
  .tile { font-size: 30px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
  .tile:disabled { opacity: .25; }
  .feedback .why { color: var(--accent); }
  .score { text-align: center; color: var(--sub); font-size: 14px; margin-bottom: 12px; }

  /* patterns study */
  .pattern-set { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .pattern-set h3 { font-size: 15px; color: var(--sub); margin-bottom: 10px; font-weight: 600; }
  .pattern-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--line); }
  .pattern-row:first-of-type { border-top: none; }
  .pattern-row .arabic { font-size: 34px; }
  .pattern-row .desc { font-size: 14px; }
  .pattern-row .desc b { display: block; font-size: 16px; }
  .pattern-row .desc span { color: var(--sub); font-size: 12.5px; }
  .rule-box { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; font-size: 14.5px; line-height: 1.7; margin-bottom: 16px; }

  /* drive mode */
  .drive-stage {
    background: #10141a; color: #fff; border-radius: 18px; min-height: 420px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 18px; padding: 30px 20px; text-align: center;
  }
  .drive-stage .step-label { font-size: 15px; color: #8fb3a5; letter-spacing: .06em; }
  .drive-stage .main-text { font-size: 44px; font-weight: 800; line-height: 1.3; }
  .drive-stage .main-text.arabic { font-size: 76px; }
  .drive-stage .sub-text { font-size: 20px; color: #aaa; }
  .drive-ctl { display: flex; gap: 10px; margin-top: 16px; justify-content: center; flex-wrap: wrap; }
  .drive-ctl button { font-size: 17px; padding: 14px 22px; }
  .toggle.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* phrase list */
  .phrase-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 10px; }
  .phrase-card .arabic { font-size: 40px; }
  .phrase-card .kp { font-size: 18px; font-weight: 700; margin-top: 4px; }
  .phrase-card .rm { font-size: 13px; color: var(--sub); }
  .phrase-card .mn { font-size: 14.5px; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; }
  @media (max-width: 520px) {
    .card-stage .arabic { font-size: 54px; }
    .quiz-q .arabic { font-size: 48px; }
    .drive-stage .main-text.arabic { font-size: 56px; }
  }
</style>
</head>
<body>
<header>
  <h1 onclick="go('home')">🕌 GrowArabic</h1>
  <span class="crumb" id="crumb"></span>
  <button id="menuBtn" onclick="toggleMenu(event)" style="margin-left:auto;font-size:22px;background:none;border:none;cursor:pointer;padding:4px 8px;color:var(--ink)">☰</button>
  <div id="dropMenu" style="display:none;position:absolute;top:52px;right:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.14);z-index:20;min-width:190px;overflow:hidden"></div>
</header>
<main id="main"></main>

<script src="data.js"></script>
<script src="images.js"></script>
<script src="audio.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const todayKey = () => "wrong-" + new Date().toISOString().slice(0, 10);
const seenKey = () => "seen-" + new Date().toISOString().slice(0, 10);
const getSet = (k) => new Set(JSON.parse(localStorage.getItem(k) || "[]"));
const saveSet = (k, set) => localStorage.setItem(k, JSON.stringify([...set]));
const markSeen = (id) => { const s = getSet(seenKey()); s.add(id); saveSet(seenKey(), s); };
const markWrong = (id) => { const s = getSet(todayKey()); s.add(id); saveSet(todayKey(), s); };
const clearWrong = (id) => { const s = getSet(todayKey()); s.delete(id); saveSet(todayKey(), s); };

// 단어 상태 추적: 새 단어 → 학습중 → 아는 단어(연속 3회 정답). 틀리면 다시 학습중.
const getStats = () => JSON.parse(localStorage.getItem("wordstats") || "{}");
function bump(id, ok) {
  const stats = getStats();
  const s = stats[id] || { seen: 0, streak: 0 };
  s.seen++;
  s.streak = ok ? s.streak + 1 : 0;
  stats[id] = s;
  localStorage.setItem("wordstats", JSON.stringify(stats));
}
function statusOf(id, stats) {
  const s = (stats || getStats())[id];
  if (!s || !s.seen) return "new";
  return s.streak >= 3 ? "known" : "learning";
}
const shuffle = (a) => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
VOCAB.push(...JSON.parse(localStorage.getItem("customVocab") || "[]"));
const byId = Object.fromEntries(VOCAB.map(w => [w.id, w]));

// ── TTS (없어도 앱은 동작; 있으면 아랍어/한국어 읽어줌)
let arVoice = null, koVoice = null;
function loadVoices() {
  const vs = speechSynthesis.getVoices();
  arVoice = vs.find(v => v.lang.startsWith("ar")) || null;
  koVoice = vs.find(v => v.lang.startsWith("ko")) || null;
}
if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, lang, rate = 1, onend) {
  if (!("speechSynthesis" in window)) { onend && setTimeout(onend, 800); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  const v = lang.startsWith("ar") ? arVoice : koVoice;
  if (v) u.voice = v;
  u.rate = rate;
  if (onend) { u.onend = onend; u.onerror = onend; }
  speechSynthesis.speak(u);
}
let curAudio = null;
const stopSpeak = () => {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (curAudio) { curAudio.pause(); curAudio = null; }
};
// 아랍어 발음: 선택한 보이스의 녹음 파일 → grady 폴백 → 브라우저 TTS 폴백
const VOICES = [
  { id: "grady", label: "1번 · 남성 (Grady)" },
  { id: "yara", label: "2번 · 여성 (Yara)" },
  { id: "marcus", label: "3번 · 남성 (Marcus)" },
  { id: "soraya", label: "4번 · 여성 (Soraya)" },
];
const getVoice = () => localStorage.getItem("voice") || "grady";
function sayAr(id, text, rate = 0.85, onend, voiceOv) {
  stopSpeak();
  if (typeof AUDIO !== "undefined" && AUDIO.has(id)) {
    const a = new Audio(`audio/${voiceOv || getVoice()}/${id}.mp3`);
    a.playbackRate = rate / 0.85;
    curAudio = a;
    if (onend) a.onended = () => onend();
    a.onerror = () => {
      const g = new Audio(`audio/grady/${id}.mp3`);
      g.playbackRate = rate / 0.85;
      curAudio = g;
      if (onend) g.onended = () => onend();
      g.onerror = () => speak(text, "ar-SA", rate, onend);
      g.play();
    };
    a.play();
  } else speak(text, "ar-SA", rate, onend);
}
// 한국어 뜻 발음: 전용 녹음(Hana) → 브라우저 TTS 폴백
function sayKo(id, text, onend) {
  stopSpeak();
  if (typeof AUDIO !== "undefined" && AUDIO.has(id)) {
    const a = new Audio(`audio/ko/${id}.mp3`);
    curAudio = a;
    if (onend) a.onended = () => onend();
    a.onerror = () => speak(text, "ko-KR", 1, onend);
    a.play();
  } else speak(text, "ko-KR", 1, onend);
}
function setVoice(v) {
  localStorage.setItem("voice", v);
  document.querySelectorAll("[data-voice]").forEach(b => {
    const on = b.dataset.voice === v;
    b.style.background = on ? "var(--accent)" : "var(--card)";
    b.style.color = on ? "#fff" : "var(--ink)";
    b.style.borderColor = on ? "var(--accent)" : "var(--line)";
  });
  sayAr("salaam", "السَّلَامُ عَلَيْكُمْ");
}

// ── 단축키 설정 (기본값 + 사용자 변경, localStorage 저장)
const DEFAULT_KEYS = { prev: "KeyQ", pause: "KeyW", next: "KeyE", speak: "Digit1", flip: "Digit2", star: "Digit3", dunno: "Digit4", know: "Digit5" };
const KEY_NAMES = { prev: "이전 카드", pause: "일시정지/뒤집기", next: "다음 카드", speak: "발음 듣기", flip: "내용보기", star: "안 외워짐 체크", dunno: "몰라요", know: "알아요" };
const savedKeymap = JSON.parse(localStorage.getItem("keymap") || "{}");
if (!savedKeymap.flip) localStorage.removeItem("keymap"); // 구버전 키맵은 새 기본값으로 초기화
let KEYS = { ...DEFAULT_KEYS, ...(savedKeymap.flip ? savedKeymap : {}) };
const saveKeys = () => localStorage.setItem("keymap", JSON.stringify(KEYS));
const keyLabel = (code) => ({ Space: "스페이스", ArrowLeft: "←", ArrowRight: "→", ArrowUp: "↑", ArrowDown: "↓", Enter: "Enter" }[code] || code.replace(/^Key|^Digit|^Numpad/, ""));

// ── 헤더 메뉴 (☰ 드롭다운)
function toggleMenu(e) {
  e && e.stopPropagation();
  const dm = document.getElementById("dropMenu");
  if (dm.style.display === "block") { dm.style.display = "none"; return; }
  const item = (label, action) => `<div onclick="document.getElementById('dropMenu').style.display='none';${action}" style="padding:12px 16px;font-size:15px;cursor:pointer;border-bottom:1px solid var(--line)" onmouseover="this.style.background='var(--accent-soft)'" onmouseout="this.style.background=''">${label}</div>`;
  dm.innerHTML =
    item("🏠 홈", "go('home')") +
    item("📅 오늘의 학습", "go('cards','today')") +
    menuOrder().map(id => item(MENU_DEFS[id].html.split("<small>")[0].trim(), MENU_DEFS[id].action.replace(/"/g, "&quot;"))).join("");
  dm.lastElementChild && (dm.lastElementChild.style.borderBottom = "none");
  dm.style.display = "block";
}
document.addEventListener("click", (e) => {
  const dm = document.getElementById("dropMenu");
  if (dm && dm.style.display === "block" && !dm.contains(e.target)) dm.style.display = "none";
});

// ── 라우팅
const views = {};
let currentView = "";
function go(name, arg) {
  currentView = name;
  const dm = document.getElementById("dropMenu");
  if (dm) dm.style.display = "none";
  stopSpeak(); driveStop();
  if (typeof clearCardTimers === "function") clearCardTimers();
  const labels = { home: "", cards: "단어 카드", quiz: "복습 퀴즈", patterns: "문법 패턴", drive: "운전 모드", phrases: "회화 표현", list: "단어장 목록", keys: "설정", add: "단어 추가" };
  $("#crumb").textContent = labels[name] || "";
  views[name](arg);
  window.scrollTo(0, 0);
}

// ── 대시보드
views.home = () => {
  const wrong = getSet(todayKey()).size;
  const seen = getSet(seenKey()).size;
  const starred = getSet("starred").size;
  const stats = getStats();
  const known = VOCAB.filter(w => statusOf(w.id, stats) === "known").length;
  const learning = VOCAB.filter(w => statusOf(w.id, stats) === "learning").length;
  $("#main").innerHTML = `
    <div class="stats">
      <div class="stat"><b>${VOCAB.length}</b><span>누적 단어</span></div>
      <div class="stat"><b>${learning}</b><span>학습중</span></div>
      <div class="stat" style="${known ? 'border-color:var(--accent)' : ''}"><b>${known}</b><span>아는 단어 (3연속 정답)</span></div>
      <div class="stat" style="${wrong ? 'border-color:var(--wrong)' : ''}"><b>${wrong}</b><span>오늘 틀린 단어</span></div>
    </div>
    <div class="menu">
      <button class="wide" style="border-color:var(--accent);background:var(--accent-soft)" onclick="go('cards','today')">📅 오늘의 학습 <small>웜업(학습중 최대 10개) + 새 단어 최대 7개</small></button>
      ${wrong ? `<button class="wide" style="border-color:var(--wrong)" onclick="go('cards','wrong')">🔁 오늘의 복습 <small>틀린 ${wrong}개 다시 보기</small></button>` : ""}
      ${starred ? `<button class="wide" style="border-color:#e0a800" onclick="go('cards','starred')">⭐ 안 외워지는 단어 <small>체크한 ${starred}개만 반복</small></button>` : ""}
      ${menuOrder().map(id => MENU_DEFS[id] ? `<button onclick="${MENU_DEFS[id].action}">${MENU_DEFS[id].html}</button>` : "").join("")}
    </div>`;
};
// 메뉴 순서 (설정에서 변경 가능)
const MENU_DEFS = {
  cards: { name: "단어 카드", html: "🃏 단어 카드 <small>큰 글씨 + 모음표시</small>", action: "go('cards')" },
  list: { name: "단어장 목록", html: "📖 단어장 목록 <small>전체 단어 쭉 보기</small>", action: "go('list')" },
  quiz: { name: "복습 퀴즈", html: "✍️ 복습 퀴즈 <small>뜻·성별·한정 맞히기</small>", action: "go('quiz')" },
  patterns: { name: "문법 패턴", html: "📐 문법 패턴 <small>형용사 3패턴 · هَلْ 의문문</small>", action: "go('patterns')" },
  drive: { name: "운전 모드", html: "🚗 운전 모드 <small>듣기 반복 (뜻→아랍어→발음)</small>", action: "go('drive')" },
  phrases: { name: "회화 표현", html: "💬 회화 표현 <small>인사·감사·일상 표현</small>", action: "go('phrases')" },
  pdf: { name: "PDF 열기", html: "📄 PDF 열기 <small>프린트용 단어장</small>", action: "window.open('pdf/arabic-basic-vocab-large.pdf')" },
  add: { name: "단어 추가", html: "➕ 단어 추가 <small>직접 수집한 단어 등록</small>", action: "go('add')" },
  settings: { name: "설정", html: "⚙️ 설정 <small>발음 목소리 · 메뉴 순서 · 단축키</small>", action: "go('keys')" },
};
const DEFAULT_MENU = ["cards", "list", "quiz", "patterns", "drive", "phrases", "pdf", "add", "settings"];
// 단어 추가는 아직 개발 중 — 로컬(file://)에서만 노출, 라이브에서는 숨김
const DEV = location.protocol === "file:" || location.hostname === "localhost";
function menuOrder() {
  const saved = JSON.parse(localStorage.getItem("menuOrder") || "[]").filter(id => MENU_DEFS[id]);
  return [...saved, ...DEFAULT_MENU.filter(id => !saved.includes(id))].filter(id => DEV || id !== "add");
}
function moveMenu(id, dir) {
  const order = menuOrder();
  const i = order.indexOf(id), j = i + dir;
  if (j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  localStorage.setItem("menuOrder", JSON.stringify(order));
  views.keys();
}

// ── 단어 카드
let deck = [], deckIdx = 0, flipped = false, autoSec = 0, cardTimers = [], autoPaused = false, cardsMode;
// 단어 필터: 품사 그룹 / ⭐안외워짐만 / 🏆아는 단어 제외 (카드·단어장 공용, 저장됨)
let wordFilter = JSON.parse(localStorage.getItem("wordFilter") || '{"pos":"","starOnly":false,"skipKnown":false}');
const POS_GROUPS = { "명사": ["명사", "집합명사"], "형용사": ["형용사", "분사"], "동사": ["동사"] };
function posGroup(w) {
  for (const g in POS_GROUPS) if (POS_GROUPS[g].includes(w.pos)) return g;
  return "기타";
}
function applyFilter(list) {
  const s = getSet("starred"), stats = getStats();
  return list.filter(w =>

function startQuiz(mode) {

  if (mode === "gender") items = shuffle(VOCAB.filter(w => (w.gender === "m" || w.gender === "f") && ["명사", "집합명사"].includes(w.pos))).slice(0, 12);
  else if (mode === "definite") items = shuffle(PATTERNS.flatMap(p => p.forms.map(f => ({ ...f, set: p })))).slice(0, 10);

  else if (mode === "sent2ko") items = shuffle([...EXAMPLES]).slice(0, 10);
  else if (mode === "build") items = shuffle(EXAMPLES.filter(e => e.ar.split(" ").length >= 2)).slice(0, 8);
  else items = shuffle(VOCAB.filter(w => w.pos !== "이름")).slice(0, 12);

function quizNext() { quizState.idx++; renderQuiz(); }

    choices = shuffle([it.ko, ...shuffle(VOCAB.filter(w => w.id !== it.id && w.pos !== "이름")).slice(0, 3).map(w => w.ko)]);
  } else if (mode === "ko2ar") {

  } else if (mode === "gender") {

    choices = ["남성", "여성"];

    if (ok) setTimeout(quizNext, whyText ? 1900 : 1100);
  }
}

// 해석 → 문장 조립 (단어 타일)
function renderBuild() {
  const { items, idx, right } = quizState;
  const it = items[idx];
  const words = it.ar.split(" ");
  const tiles = shuffle(words.map((w, i) => ({ w, i })));
  const picked = [];
  let done = false;
  $("#main").innerHTML = `
    <div class="score">${idx + 1} / ${items.length} · 정답 ${right}</div>
    <div class="quiz-q">
      <div class="prompt">이 해석에 맞게 단어를 순서대로 탭하세요</div>
      <div class="ko-big">${it.ko}</div>
      <div class="assembled arabic" id="asm"></div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="controls"><button id="undoBtn">↩️ 하나 지우기</button></div>
    <div class="feedback" id="fb"></div>`;
  const asm = $("#asm"), tilesEl = $("#tiles"), fb = $("#fb");
  function draw() {
    asm.textContent = picked.map(p => p.w).join(" ");
    tilesEl.innerHTML = "";
    tiles.forEach(t => {
      const b = document.createElement("button");
      b.className = "tile arabic";
      b.textContent = t.w;
      b.disabled = done || picked.includes(t);
      b.onclick = () => { picked.push(t); draw(); check(); };
      tilesEl.appendChild(b);
    });
  }
  function check() {
    if (picked.length < words.length) return;
    done = true;
    draw();
    const ok = picked.map(p => p.w).join(" ") === it.ar;
    if (ok) quizState.right++;
    else quizState.wrongs.push({
      q: `<div class="ko-big" style="font-size:22px">${it.ko}</div>`,
      my: `<span class="arabic">${picked.map(p => p.w).join(" ")}</span>`,
      correct: `<span class="arabic">${it.ar}</span>`,
      why: it.roman,
    });
    fb.innerHTML = `${ok ? "⭕ 정답!" : `❌ 정답: <div class="arabic" style="font-size:34px">${it.ar}</div>`}<div class="why">${it.roman}</div>
      ${ok ? "" : `<div class="controls" style="margin-top:10px"><button class="primary" onclick="quizNext()">확인했어요, 다음 →</button></div>`}`;
    if (ok) setTimeout(quizNext, 1400);
  }
  $("#undoBtn").onclick = () => { if (!done && picked.length) { picked.pop(); draw(); } };
  draw();
}

let driveTimer = null, drivePlaying = false, driveList = [], driveIdx = 0, driveRate = 0.85;
const DRIVE_SPEEDS = [["0.5", "🐢 아주 느리게"], ["0.65", "🚶 느리게"], ["0.85", "🚗 보통"], ["1.1", "🏎 빠르게"]];

};
function driveSetRate(r) {
  driveRate = r;
  document.querySelectorAll("#speedRow .toggle").forEach(b => b.classList.toggle("on", +b.dataset.rate === r));
}
function driveSetList(kind, silent) {
  driveStop();
  driveList = kind === "phrases"
    ? shuffle([...PHRASES])
    : shuffle(VOCAB.filter(w => w.pos !== "이름")).slice(0, 10);
  driveIdx = 0;
  if (!silent) driveToggle(true);
}
function driveToggle(forcePlay) {
  if (drivePlaying && !forcePlay) { driveStop(); return; }
  drivePlaying = true;
  $("#drivePlayBtn") && ($("#drivePlayBtn").textContent = "⏸ 정지");
  driveStep();
}
function driveStop() {
  drivePlaying = false;
  clearTimeout(driveTimer);
  stopSpeak();
  const btn = document.getElementById("drivePlayBtn");
  if (btn) btn.textContent = "▶️ 재생";
}
function driveShow(label, main, sub, isArabic) {
  const st = document.getElementById("driveStage");
  if (!st) return;
  st.innerHTML = `
    <div class="step-label">${label} · ${driveIdx + 1}/${driveList.length}</div>
    <div class="main-text ${isArabic ? "arabic" : ""}">${main}</div>
    ${sub ? `<div class="sub-text">${sub}</div>` : ""}`;
}
function driveStep() {
  if (!drivePlaying || !driveList.length) return;
  const it = driveList[driveIdx % driveList.length];
  const rate = driveRate;
  const ko = it.ko;
  const next = (fn, ms) => { driveTimer = setTimeout(() => drivePlaying && fn(), ms); };

  driveShow("한국어 뜻", ko, "", false);
  sayKo(it.id, ko, () => next(step2, 500));
  function step2() {
    driveShow("아랍어", it.ar, "", true);
    sayAr(it.id, it.ar, rate, () => next(step3, 600));
  }
  function step3() {
    driveShow("아랍어 한 번 더", it.ar, it.koPron || "", true);
    sayAr(it.id, it.ar, rate, () => next(step4, 500));
  }
  function step4() {
    driveShow("발음", it.roman, it.koPron || "", false);
    next(() => { driveIdx++; driveStep(); }, Math.round(1600 / driveRate));
  }
}

function rebind(action) {
  $("#rebindHint").textContent = `[${KEY_NAMES[action]}] 새 키를 누르세요 (ESC 취소)`;
  const h = (e) => {
    e.preventDefault(); e.stopPropagation();
    const code = e.code.replace(/^Numpad(\d)$/, "Digit$1");
    if (code === "Escape") { views.keys(); return; }
    const taken = Object.keys(KEYS).find(a => a !== action && KEYS[a] === code);
    if (taken) {
      $("#rebindHint").textContent = `"${keyLabel(code)}" 키는 이미 [${KEY_NAMES[taken]}]에 있습니다. 다른 키를 누르세요 (ESC 취소)`;
      document.addEventListener("keydown", h, { once: true, capture: true });
      return;
    }
    KEYS[action] = code; saveKeys(); views.keys();
    $("#rebindHint").textContent = `✅ [${KEY_NAMES[action]}] → ${keyLabel(code)} 저장됨`;
  };
  document.addEventListener("keydown", h, { once: true, capture: true });
}

const OCR_URL = "https://ptbwpeeelgsjktoanvlj.supabase.co/functions/v1/growarabic-ocr";
let OCR_RESULTS = null, OCR_BUSY = false;
async function ocrPhoto(file) {
  if (!file || OCR_BUSY) return;
  OCR_BUSY = true; OCR_RESULTS = null; views.add();
  try {
    const url = URL.createObjectURL(file);
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("이미지를 읽을 수 없습니다")); img.src = url; });
    const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const b64 = c.toDataURL("image/jpeg", 0.85).split(",")[1];
    const r = await fetch(OCR_URL, {
      method: "POST",
      headers: { "content-type": "application/json", "x-app-token": "growarabic" },
      body: JSON.stringify({ image: b64, media_type: "image/jpeg" }),
    });
    const data = await r.json();
    if (!r.ok || data.error) throw new Error(data.error || `서버 오류 (${r.status})`);
    OCR_RESULTS = (data.words || []).map(w => ({ ...w, added: false }));
  } catch (e) { OCR_RESULTS = { error: String(e.message || e) }; }
  OCR_BUSY = false; views.add();
}
function addOcrWord(i) {
  const w = OCR_RESULTS[i];
  if (!w || w.added) return;
  const word = { id: "u" + Date.now() + "_" + i, ar: w.ar, ko: w.ko, roman: w.roman, en: w.en, pos: w.pos, gender: w.gender || null, note: w.note, custom: true, date: new Date().toISOString().slice(0, 10) };
  const custom = JSON.parse(localStorage.getItem("customVocab") || "[]");
  custom.push(word);
  localStorage.setItem("customVocab", JSON.stringify(custom));
  VOCAB.push(word);
  w.added = true;
  views.add();
}
function addAllOcr() { OCR_RESULTS.forEach((w, i) => { if (!w.added && !VOCAB.some(v => v.ar === w.ar)) addOcrWord(i); }); }
function fillOcr(i) {
  const w = OCR_RESULTS[i];
  views.add();
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ""; };
  set("f-ar", w.ar); set("f-ko", w.ko); set("f-roman", w.roman); set("f-en", w.en); set("f-pos", w.pos); set("f-gender", w.gender); set("f-note", w.note);
}
function ocrResultsHtml() {
  if (OCR_BUSY) return `<div class="rule-box">📷 사진 분석 중… 10~30초 걸립니다</div>`;
  if (!OCR_RESULTS) return "";
  if (OCR_RESULTS.error) return `<div class="rule-box" style="color:var(--wrong)">⚠️ 사진 분석 실패: ${OCR_RESULTS.error}</div>`;
  if (!OCR_RESULTS.length) return `<div class="rule-box">사진에서 아랍어 단어를 찾지 못했습니다</div>`;
  const dup = (w) => !w.added && VOCAB.some(v => v.ar === w.ar);
  return `
    <h2 style="font-size:16px;color:var(--sub);margin:18px 4px 8px">📷 사진에서 찾은 단어 (${OCR_RESULTS.length})</h2>
    ${OCR_RESULTS.map((w, i) => `
      <div class="phrase-card" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div style="min-width:0" onclick="fillOcr(${i})">
          <span class="arabic" style="font-size:28px">${w.ar}</span> <b>${w.ko}</b>
          <span style="color:var(--sub);font-size:13px">${w.roman || ""} · ${w.pos}${w.gender ? " · " + (w.gender === "f" ? "여성" : "남성") : ""}</span>
          ${w.note ? `<div style="color:var(--sub);font-size:13px">${w.note}</div>` : ""}
        </div>
        ${w.added ? `<span style="color:var(--accent);font-weight:700;flex-shrink:0">✅</span>`
          : dup(w) ? `<span style="color:var(--sub);font-size:13px;flex-shrink:0">이미 있음</span>`
          : `<button class="choice" style="padding:8px 14px;flex-shrink:0" onclick="addOcrWord(${i})">➕ 추가</button>`}
      </div>`).join("")}
    ${OCR_RESULTS.some((w, i) => !w.added && !dup(w)) ? `<button class="bigbtn primary" onclick="addAllOcr()">➕ 전부 추가하기</button>` : ""}
    <div class="hint">단어를 탭하면 아래 폼에 채워져서 수정 후 추가할 수 있습니다</div>`;
}

function delWord(id) {

  localStorage.setItem("customVocab", JSON.stringify(custom));
  const i = VOCAB.findIndex(w => w.id === id);
  if (i >= 0) VOCAB.splice(i, 1);
  views.add();
}

// ── 회화 표현 목록
views.phrases = () => {
  $("#main").innerHTML = PHRASES.map(p => `
    <div class="phrase-card" onclick="sayAr('${p.id}','${p.ar.replace(/'/g, "\\'")}')">
      <div class="arabic">${p.ar}</div>
      <div class="kp">${p.koPron} <span style="font-weight:400;font-size:15px">— ${p.ko}</span></div>
      <div class="rm">${p.roman}</div>
      <div class="mn">${p.note}</div>
    </div>`).join("") + `<div class="hint">카드를 탭하면 발음을 들려줍니다</div>`;
};

go("home");
</script>
</body>
</html>
